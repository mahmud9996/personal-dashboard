<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0207"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1f3d"/>
      <stop offset="100%" stop-color="#a30016"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- glow -->
  <circle cx="300" cy="250" r="180" fill="#ff1f3d" opacity="0.12"/>
  <!-- charging case -->
  <rect x="215" y="300" width="170" height="120" rx="22" fill="url(#case)" stroke="url(#red)" stroke-width="2.5"/>
  <rect x="235" y="320" width="130" height="14" rx="7" fill="#000" opacity="0.6"/>
  <!-- earbuds -->
  <g>
    <ellipse cx="265" cy="285" rx="20" ry="26" fill="url(#red)"/>
    <rect x="258" y="295" width="14" height="34" rx="7" fill="#e6e6e6"/>
    <ellipse cx="335" cy="285" rx="20" ry="26" fill="url(#red)"/>
    <rect x="328" y="295" width="14" height="34" rx="7" fill="#e6e6e6"/>
  </g>
  <!-- title -->
  <text x="300" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#fff" letter-spacing="2">ZERO AIR</text>
  <text x="300" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="url(#red)" font-weight="700" letter-spacing="3">TRUE WIRELESS EARBUDS</text>
  <!-- badge -->
  <rect x="430" y="70" width="135" height="34" rx="6" fill="url(#red)"/>
  <text x="497" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" letter-spacing="1">BLUETOOTH AUDIO</text>
  <!-- feature chips -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#ddd">
    <rect x="120" y="470" width="160" height="36" rx="18" fill="#1a1a1a" stroke="#ff1f3d" stroke-width="1.5"/>
    <text x="200" y="493" text-anchor="middle" fill="#fff">🎯 Smart Touch</text>
    <rect x="320" y="470" width="160" height="36" rx="18" fill="#1a1a1a" stroke="#ff1f3d" stroke-width="1.5"/>
    <text x="400" y="493" text-anchor="middle" fill="#fff">🔇 Noise Reduction</text>
  </g>
  <text x="300" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888">gearaboo.com • 01878438082</text>
</svg>
