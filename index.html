<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Dashboard — Mahmud × Hermes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div>
    <h1><span class="pulse"></span>Personal Dashboard</h1>
    <div class="sub">Mahmud × Hermes — private workspace • auto-updated by agent</div>
  </div>
  <div class="sub" id="clock"></div>
</header>
<nav>
  <button data-t="products" class="active">📊 প্রোডাক্ট রিসার্চ</button>
  <button data-t="learning">📚 টেক শেখা</button>
  <button data-t="todos">✅ টু-ডু</button>
  <button data-t="activity">🤖 এজেন্ট লগ</button>
</nav>
<main>
  <section id="sec-products" class="active"></section>
  <section id="sec-learning"></section>
  <section id="sec-todos"></section>
  <section id="sec-activity"></section>
</main>
<footer>Generated by Hermes • Termux/Android • github.com/mahmud9996/personal-dashboard (private)</footer>
<script>
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
  setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleString("bn-BD");},1000);
</script>
<script src="assets/app.js"></script>
</body>
</html>
